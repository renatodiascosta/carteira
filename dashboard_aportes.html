<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aportes — Registro 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#0a0e14;
    --surface:#10151f;
    --surface-2:#161d2b;
    --ink:#e6edf3;
    --muted:#7d8da3;
    --dim:#4b5a70;
    --line:#1f2937;
    --accent:#39d98a;
    --accent-2:#4aa8ff;
    --accent-soft:rgba(57,217,138,.16);
    --neg:#ff6b6b;
    --warn:#ffb454;
    --radius:13px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Archivo",system-ui,-apple-system,sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(900px 500px at 85% -10%, rgba(74,168,255,.07), transparent 60%),
      radial-gradient(700px 500px at 0% 110%, rgba(57,217,138,.06), transparent 55%);
    background-attachment:fixed;
    min-height:100vh;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:32px 24px 64px}

  /* ---------- cabeçalho ---------- */
  header{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between;margin-bottom:28px;
    border-bottom:1px solid var(--line);padding-bottom:22px}
  .eyebrow{
    font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);margin:0 0 6px
  }
  h1{font-size:26px;font-weight:800;letter-spacing:-.4px;margin:0}
  .stats{display:flex;gap:28px}
  .stat .k{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .stat .v{font-family:"Space Mono",monospace;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}

  /* ---------- painéis ---------- */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
  .panel + .panel{margin-top:18px}
  .panel-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
  .panel-title{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

  button,select{font-family:inherit;font-size:13px;color:var(--ink);background:var(--surface-2);
    border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- dropdowns ---------- */
  .filtros{display:flex;flex-wrap:wrap;gap:16px}
  .campo{flex:1 1 260px;min-width:0}
  .campo > label{display:block;font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .dd{position:relative}
  .dd-btn{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:9px 12px;font-size:14px;text-align:left;border-radius:8px;transition:.18s
  }
  .dd-btn:hover{border-color:var(--dim)}
  .dd-btn[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),0 0 22px -8px var(--accent)}
  .dd-btn .seta{color:var(--muted);font-size:10px;flex:none}
  .dd-btn .rotulo{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dd-panel{
    position:absolute;z-index:20;top:calc(100% + 6px);left:0;right:0;
    background:var(--surface);border:1px solid var(--line);border-radius:8px;
    box-shadow:0 12px 28px rgba(0,0,0,.55);
    max-height:320px;overflow:auto;padding:6px;display:none;
    scrollbar-color:var(--line) transparent
  }
  .dd-panel::-webkit-scrollbar{width:10px}
  .dd-panel::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:3px solid var(--surface)}
  .dd-panel.aberto{display:block}
  .opt{
    width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--ink);
    padding:7px 8px;border-radius:6px;text-align:left;font-size:14px
  }
  .opt:hover{background:var(--surface-2)}
  .opt .marca{
    flex:none;width:15px;height:15px;border:1.5px solid var(--line);border-radius:4px;
    display:grid;place-items:center;font-size:10px;color:#08110b;line-height:1
  }
  .opt[aria-checked="true"] .marca{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px -2px var(--accent)}
  .opt .nome{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .opt .nome.mono{font-family:"Space Mono",monospace;font-size:13px;font-weight:400;letter-spacing:.02em}
  .opt .val{font-family:"Space Mono",monospace;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
  .opt.todos{border-bottom:1px solid var(--line);border-radius:6px 6px 0 0;margin-bottom:4px;padding-bottom:9px}
  .opt.todos .nome{font-weight:700}

  /* ---------- gráfico ---------- */
  .chart{position:relative}
  svg{display:block;width:100%;height:auto}
  .grid{stroke:var(--line);stroke-width:1}
  .zero{stroke:var(--dim);stroke-width:1}
  .tick{font-family:"Space Mono",monospace;font-size:11px;fill:var(--dim)}
  .barlabel{font-family:"Space Mono",monospace;font-size:11px;fill:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
  .bar{fill:var(--accent)}
  .bar.neg{fill:var(--neg)}
  .hit{fill:transparent;cursor:pointer}
  .hit:hover + .bar,.hit:focus-visible + .bar{fill-opacity:.78}

  .tip{
    position:absolute;pointer-events:none;z-index:5;min-width:172px;
    background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;
    font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.6);opacity:0;transition:opacity .12s
  }
  .tip.on{opacity:1}
  .tip h4{margin:0 0 6px;font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400}
  .tip .row{display:flex;justify-content:space-between;gap:16px;font-family:"Space Mono",monospace;font-variant-numeric:tabular-nums;color:var(--muted)}
  .tip .row.total{border-top:1px solid var(--line);margin-top:6px;padding-top:6px;font-weight:700;color:var(--accent)}

  .note{font-size:12.5px;color:var(--dim);margin-top:14px}
  .banner{background:rgba(255,180,84,.07);border:1px solid rgba(255,180,84,.25);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:18px;line-height:1.5}
  .banner b{font-weight:700;color:#ffd9a0}
  .banner code{font-family:"Space Mono",monospace;font-size:12px;color:#ffd9a0}
  .banner input{margin-top:6px;display:block;font-size:12px;color:var(--muted)}
  .empty{padding:48px 0;text-align:center;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:640px){
    .wrap{padding:20px 14px 48px}
    .stats{gap:18px}
    header{gap:14px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="banner"></div>

  <header>
    <div>
      <!-- <p class="eyebrow">Registro 2026 · aba Aportes</p> -->
      <h1>Aportes por mês</h1>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">Total</div><div class="v" id="s-total">—</div></div>
      <div class="stat"><div class="k">Média / mês</div><div class="v" id="s-media">—</div></div>
    </div>
  </header>

  <section class="panel">
    <div class="filtros">
      <div class="campo">
        <label id="lb-ativo">Ativo</label>
        <div class="dd" id="dd-ativo"></div>
      </div>
      <div class="campo">
        <label id="lb-setor">Setor</label>
        <div class="dd" id="dd-setor"></div>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <span class="panel-title">Valor aportado (R$)</span>
      <span class="panel-title" id="periodo"></span>
    </div>
    <div class="chart" id="chart"></div>
    <p class="note" id="note"></p>
  </section>
</div>

  function aplicar(aportesRaw, setoresRaw){
    var lista = Array.isArray(aportesRaw) ? aportesRaw : (aportesRaw.aportes || []);
    var setores = Array.isArray(setoresRaw) ? setoresRaw : (setoresRaw.ativos || []);
    estado.aportes = normalizar(lista);
    estado.setorDe = {};
    setores.forEach(function(s){
      if (s && s.ticker) estado.setorDe[String(s.ticker).toUpperCase()] = (s.setor || "").trim() || SEM_SETOR;
    });
    todosAtivos().forEach(function(t){
      if (!estado.setorDe[t]) estado.setorDe[t] = SEM_SETOR;
    });
    estado.setoresSel = new Set(todosSetores());
    estado.ativosSel = new Set(todosAtivos());
  }

  var _totais = null;
  function totalPorTicker(){
    if (_totais) return _totais;
    var t = {};
    estado.aportes.forEach(function(a){ t[a.ticker] = (t[a.ticker]||0) + a.valor; });
    return (_totais = t);
  }

  function todosAtivos(){                                  // ordenados por valor aportado
    var t = totalPorTicker();
    return Object.keys(t).sort(function(x,y){ return t[y]-t[x]; });
  }

  function todosSetores(){
    var vistos = {};
    todosAtivos().forEach(function(a){ vistos[estado.setorDe[a] || SEM_SETOR] = true; });
    return Object.keys(vistos).sort(function(a,b){ return a.localeCompare(b,"pt-BR"); });
  }

  function ativosDoSetor(){                                // ativos habilitados pelo filtro de setor
    return todosAtivos().filter(function(t){ return estado.setoresSel.has(estado.setorDe[t]); });
  }

  function ativosVisiveis(){                               // o que de fato vai ao gráfico
    return ativosDoSetor().filter(function(t){ return estado.ativosSel.has(t); });
  }

  // Eixo X: sempre todos os meses do arquivo, independente do filtro
  function todosOsMeses(){
    if (!estado.aportes.length) return [];
    var min = null, max = null;
    estado.aportes.forEach(function(a){
      var n = a.ano*12 + a.mes;
      if (min === null || n < min) min = n;
      if (max === null || n > max) max = n;
    });
    var out = [];
    for (var n = min; n <= max; n++){
      var ano = Math.floor((n-1)/12), mes = ((n-1)%12)+1;
      out.push({
        chave: ano + "-" + String(mes).padStart(2,"0"),
        rotulo: MESES[mes-1] + "/" + String(ano).slice(2)
      });
    }
    return out;
  }

  function serie(){
    var sel = new Set(ativosVisiveis());
    var mapa = {};
    estado.aportes.forEach(function(a){
      if (!sel.has(a.ticker)) return;
      var m = mapa[a.chave] || (mapa[a.chave] = {total:0, porTicker:{}});
      m.total += a.valor;
      m.porTicker[a.ticker] = (m.porTicker[a.ticker]||0) + a.valor;
    });
    return todosOsMeses().map(function(m){
      var d = mapa[m.chave] || {total:0, porTicker:{}};
      return {chave:m.chave, rotulo:m.rotulo, total:d.total, porTicker:d.porTicker};
    });
  }

  // ---------------------------------------------------------------- dropdown
  function criarDropdown(cfg){
    // cfg: {alvo, rotuladoPor, itens(), estaMarcado(v), alternar(v), marcarTodos(b), plural, mono}
    var raiz = cfg.alvo;
    raiz.innerHTML =
      '<button class="dd-btn" type="button" aria-expanded="false" aria-haspopup="true">' +
        '<span class="rotulo"></span><span class="seta">▾</span></button>' +
      '<div class="dd-panel" role="group"></div>';
    var btn = raiz.querySelector(".dd-btn");
    var painel = raiz.querySelector(".dd-panel");

    function fechar(){ painel.classList.remove("aberto"); btn.setAttribute("aria-expanded","false"); }
    function abrir(){ painel.classList.add("aberto"); btn.setAttribute("aria-expanded","true"); }

    btn.addEventListener("click", function(){
      painel.classList.contains("aberto") ? fechar() : abrir();
    });
    document.addEventListener("click", function(ev){
      if (!raiz.contains(ev.target)) fechar();
    });
    raiz.addEventListener("keydown", function(ev){
      if (ev.key === "Escape"){ fechar(); btn.focus(); }
    });

    function pintar(){
      var itens = cfg.itens();
      var marcados = itens.filter(cfg.estaMarcado);
      var todos = itens.length > 0 && marcados.length === itens.length;

      btn.querySelector(".rotulo").textContent =
        todos ? "Todos" :
        marcados.length === 0 ? "Nenhum" :
        marcados.length === 1 ? marcados[0] :
        marcados.length + " " + cfg.plural;

      var html = '<button class="opt todos" type="button" role="checkbox" aria-checked="'+todos+'" data-todos="1">' +
                 '<span class="marca">'+(todos?"✓":"")+'</span><span class="nome">Todos</span>' +
                 '<span class="val">'+itens.length+'</span></button>';
      html += itens.map(function(v){
        var on = cfg.estaMarcado(v);
        return '<button class="opt" type="button" role="checkbox" aria-checked="'+on+'" data-v="'+v.replace(/"/g,"&quot;")+'">' +
               '<span class="marca">'+(on?"✓":"")+'</span>' +
               '<span class="nome'+(cfg.mono?" mono":"")+'">'+v+'</span>' +
               '<span class="val">'+cfg.valor(v)+'</span></button>';
      }).join("");
      painel.innerHTML = html;

      painel.querySelectorAll(".opt").forEach(function(o){
        o.addEventListener("click", function(){
          if (o.dataset.todos) cfg.marcarTodos(!todos);
          else cfg.alternar(o.dataset.v);
          atualizar();
        });
      });
    }

    return {pintar:pintar, fechar:fechar};
  }

  var ddSetor, ddAtivo;

  function montarDropdowns(){
    ddSetor = criarDropdown({
      alvo: document.getElementById("dd-setor"),
      plural: "setores",
      mono: false,
      itens: todosSetores,
      valor: function(s){
        var n = todosAtivos().filter(function(t){ return estado.setorDe[t] === s; }).length;
        return n + (n === 1 ? " ativo" : " ativos");
      },
      estaMarcado: function(s){ return estado.setoresSel.has(s); },
      alternar: function(s){
        estado.setoresSel.has(s) ? estado.setoresSel.delete(s) : estado.setoresSel.add(s);
        estado.ativosSel = new Set(ativosDoSetor());   // ao mudar o setor, marca tudo que sobrou
      },
      marcarTodos: function(ligar){
        estado.setoresSel = ligar ? new Set(todosSetores()) : new Set();
        estado.ativosSel = new Set(ativosDoSetor());
      }
    });

    ddAtivo = criarDropdown({
      alvo: document.getElementById("dd-ativo"),
      plural: "ativos",
      mono: true,
      itens: ativosDoSetor,
      valor: function(t){ return brlCurto.format(totalPorTicker()[t]); },
      estaMarcado: function(t){ return estado.ativosSel.has(t); },
      alternar: function(t){
        estado.ativosSel.has(t) ? estado.ativosSel.delete(t) : estado.ativosSel.add(t);
      },
      marcarTodos: function(ligar){
        estado.ativosSel = ligar ? new Set(ativosDoSetor()) : new Set();
      }
    });
  }

  // ---------------------------------------------------------------- gráfico
  function passoBonito(bruto){
    var mag = Math.pow(10, Math.floor(Math.log10(bruto)));
    var n = bruto/mag;
    return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*mag;
  }

  function desenharGrafico(dados){
    var el = document.getElementById("chart");
    if (!dados.length){
      el.innerHTML = '<p class="empty">Sem dados para exibir.</p>';
      return;
    }
    var W = 900, H = 380, ml = 76, mr = 16, mt = 26, mb = 42;
    var iw = W-ml-mr, ih = H-mt-mb;

    var maxV = Math.max(0, Math.max.apply(null, dados.map(function(d){return d.total;})));
    var minV = Math.min(0, Math.min.apply(null, dados.map(function(d){return d.total;})));
    var passo = passoBonito(Math.max(1,(maxV-minV))/4);
    var topo = Math.ceil(maxV/passo)*passo || passo;
    var base = Math.floor(minV/passo)*passo;
    var y = function(v){ return mt + ih - (v-base)/(topo-base)*ih; };

    var banda = iw/dados.length;
    var bw = Math.min(64, banda*0.56);
    var rotula = dados.length <= 14;   // com muitos meses, o valor sobre a barra vira ruído

    var svg = ['<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Valor aportado por mês">'];
    for (var v = base; v <= topo+1e-6; v += passo){
      svg.push('<line class="'+(Math.abs(v)<1e-6?'zero':'grid')+'" x1="'+ml+'" x2="'+(W-mr)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'"/>');
      svg.push('<text class="tick" x="'+(ml-10)+'" y="'+(y(v)+4).toFixed(1)+'" text-anchor="end">'+brlCurto.format(v)+'</text>');
    }
    dados.forEach(function(d,i){
      var cx = ml + banda*i + banda/2;
      var y0 = y(0), y1 = y(d.total);
      var alt = Math.max(Math.abs(y1-y0), d.total===0?0:1.5);
      var top = Math.min(y0,y1);
      svg.push('<rect class="hit" data-i="'+i+'" tabindex="0" x="'+(cx-banda/2)+'" y="'+mt+'" width="'+banda+'" height="'+ih+'"/>');
      svg.push('<rect class="bar'+(d.total<0?' neg':'')+'" x="'+(cx-bw/2).toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+alt.toFixed(1)+'" rx="2"/>');
      if (rotula && d.total !== 0){
        var ly = d.total >= 0 ? top-8 : top+alt+15;
        svg.push('<text class="barlabel" x="'+cx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="middle">'+brlCurto.format(d.total)+'</text>');
      }
      svg.push('<text class="tick" x="'+cx.toFixed(1)+'" y="'+(H-mb+22)+'" text-anchor="middle">'+d.rotulo+'</text>');
    });
    svg.push('</svg><div class="tip" id="tip"></div>');
    el.innerHTML = svg.join("");

    var tip = document.getElementById("tip");
    el.querySelectorAll(".hit").forEach(function(hit){
      function mostrar(ev){
        var d = dados[+hit.dataset.i];
        var itens = Object.keys(d.porTicker).map(function(t){ return {t:t, v:d.porTicker[t]}; })
                     .sort(function(a,b){ return Math.abs(b.v)-Math.abs(a.v); });
        var html = '<h4>'+d.rotulo+'</h4>';
        if (!itens.length){
          html += '<div class="row"><span>sem aporte</span><span>'+brl.format(0)+'</span></div>';
        } else {
          var visiveis = itens.slice(0,6), resto = itens.slice(6);
          visiveis.forEach(function(i){ html += '<div class="row"><span>'+i.t+'</span><span>'+brl.format(i.v)+'</span></div>'; });
          if (resto.length){
            var soma = resto.reduce(function(s,i){ return s+i.v; },0);
            html += '<div class="row"><span>+'+resto.length+' outros</span><span>'+brl.format(soma)+'</span></div>';
          }
          html += '<div class="row total"><span>Total</span><span>'+brl.format(d.total)+'</span></div>';
        }
        tip.innerHTML = html;
        tip.classList.add("on");
        var caixa = el.getBoundingClientRect();
        var px = (ev && ev.clientX !== undefined) ? ev.clientX - caixa.left : hit.getBoundingClientRect().left - caixa.left;
        var py = (ev && ev.clientY !== undefined) ? ev.clientY - caixa.top : 40;
        tip.style.left = Math.min(Math.max(px+14, 0), caixa.width - tip.offsetWidth - 4) + "px";
        tip.style.top  = Math.max(py - tip.offsetHeight - 12, 0) + "px";
      }
      hit.addEventListener("mousemove", mostrar);
      hit.addEventListener("focus", mostrar);
      hit.addEventListener("mouseleave", function(){ tip.classList.remove("on"); });
      hit.addEventListener("blur", function(){ tip.classList.remove("on"); });
    });
  }

  // ---------------------------------------------------------------- ciclo
  function atualizar(){
    ddSetor.pintar();
    ddAtivo.pintar();

    var dados = serie();
    var total = dados.reduce(function(s,d){ return s+d.total; },0);
    var comAporte = dados.filter(function(d){ return d.total !== 0; }).length;

    document.getElementById("s-total").textContent  = brl.format(total);
    document.getElementById("s-media").textContent  = comAporte ? brl.format(total/comAporte) : "—";
    document.getElementById("periodo").textContent  = dados.length ? dados[0].rotulo + " — " + dados[dados.length-1].rotulo : "";

    var negativos = estado.aportes.filter(function(a){
      return estado.ativosSel.has(a.ticker) && estado.setoresSel.has(estado.setorDe[a.ticker]) && a.valor < 0;
    }).length;
    // document.getElementById("note").textContent =
    //   "Cada barra é a soma de quantidade × preço médio no mês; o eixo X mostra todos os meses do arquivo, inclusive os sem aporte do filtro atual." +
    //   (negativos ? " " + negativos + " lançamento(s) com quantidade negativa entram como saída e reduzem a barra." : "");

    desenharGrafico(dados);
  }

  function bannerSnapshot(){
    if (estado.fonte === "arquivo") return;
    document.getElementById("banner").innerHTML =
      '<div class="banner"><b>Mostrando uma cópia dos dados embutida no arquivo.</b> ' +
      'Para ler o aportes.json atual, sirva a pasta por HTTP (<code>python -m http.server 8000</code>) ' +
      'e abra <code>http://localhost:8000/dashboard.html</code> — ou escolha o arquivo aqui:' +
      '<input type="file" id="upload" accept=".json"></div>';
    document.getElementById("upload").addEventListener("change", function(ev){
      var f = ev.target.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function(){
        try {
          var setoresAtuais = Object.keys(estado.setorDe).map(function(t){
            return {ticker:t, setor:estado.setorDe[t]};
          });
          _totais = null;
          aplicar(JSON.parse(fr.result), setoresAtuais);
          document.getElementById("banner").innerHTML = "";
          atualizar();
        } catch(e){
          alert("Não consegui ler esse JSON: " + e.message);
        }
      };
      fr.readAsText(f);
    });
  }

  carregar().then(function(res){
    aplicar(res[0], res[1]);
    bannerSnapshot();
    montarDropdowns();
    atualizar();
  });
})();
</script>
